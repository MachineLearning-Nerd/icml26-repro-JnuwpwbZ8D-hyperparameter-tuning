<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-label="Proof certificate pipeline">
<rect width="1000" height="310" rx="20" fill="#f8fafc"/>
<g font-family="system-ui" text-anchor="middle">
<rect x="35" y="85" width="185" height="115" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="127" y="130" font-size="19" font-weight="700" fill="#1e3a8a">Exact source</text><text x="127" y="160" font-size="15" fill="#334155">anchors, assumptions,</text><text x="127" y="182" font-size="15" fill="#334155">quantifiers</text>
<path d="M225 142h55" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<rect x="285" y="85" width="185" height="115" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="377" y="130" font-size="19" font-weight="700" fill="#4c1d95">FOL / GJ</text><text x="377" y="160" font-size="15" fill="#334155">atom, degree, block</text><text x="377" y="182" font-size="15" fill="#334155">counts</text>
<path d="M475 142h55" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<rect x="535" y="85" width="185" height="115" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="627" y="130" font-size="19" font-weight="700" fill="#14532d">Named-class sweep</text><text x="627" y="160" font-size="15" fill="#334155">patterns, paths, KKT,</text><text x="627" y="182" font-size="15" fill="#334155">scaling signature</text>
<path d="M725 142h55" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
<rect x="785" y="85" width="180" height="115" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="875" y="130" font-size="19" font-weight="700" fill="#7c2d12">Independent checker</text><text x="875" y="160" font-size="15" fill="#334155">controls, mutations,</text><text x="875" y="182" font-size="15" fill="#334155">fail-closed exit</text>
<text x="500" y="255" font-size="18" fill="#334155">Every mismatch exits nonzero; finite cases are regression checks, not theorem proofs.</text>
</g>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#64748b"/></marker></defs>
</svg>
